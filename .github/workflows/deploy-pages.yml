name: CI e Publicação no GitHub Pages

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  deployments: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Testes Automatizados e Build Estático
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do ETL (Python)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar testes automatizados do ETL (pytest)
        run: python -m pytest

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências do Painel Web (npm)
        run: npm ci

      - name: Executar testes automatizados do Painel Web (vitest)
        run: npm test

      - name: Compilar build estático do Painel Web para o GitHub Pages
        run: npm run build

      - name: Registrar histórico de versões publicadas no GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("fs");
            const current = JSON.parse(fs.readFileSync("public/data/atual.json", "utf8"));
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: "github-pages",
              per_page: 100,
            });
            deployments.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));

            const historico = [];
            const versoesDistintas = new Set([current.versaoDados]);
            for (const deployment of deployments) {
              const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                per_page: 100,
              });
              const states = statuses.map((status) => status.state);
              let versaoDados = null;

              // Um deploy que chegou a success continua contando mesmo após receber status inactive.
              if (states.includes("success")) {
                try {
                  const response = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: "public/data/atual.json",
                    ref: deployment.sha,
                  });
                  if (response.data.type === "file") {
                    const pointer = JSON.parse(Buffer.from(response.data.content, "base64").toString("utf8"));
                    if (/^[0-9a-f]{32}$/.test(pointer.versaoDados || "")
                        && pointer.caminho === `versoes/${pointer.versaoDados}`) {
                      versaoDados = pointer.versaoDados;
                    }
                  }
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }

              historico.push({
                sha: deployment.sha,
                created_at: deployment.created_at,
                states,
                versaoDados,
              });
              if (versaoDados) versoesDistintas.add(versaoDados);
              if (versoesDistintas.size === 3) break;
            }

            fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/github-pages-deployments.json`,
              JSON.stringify(historico, null, 2),
            );

      - name: Reter somente as três versões servidas
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python scripts/package_pages.py --dist-dir dist --deployments-file "$RUNNER_TEMP/github-pages-deployments.json"

      - name: Configurar GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5

      - name: Empacotar artefato estático (dist/)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Publicar no GitHub Pages
    needs: test-and-build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy para o GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
