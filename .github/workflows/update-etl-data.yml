name: Atualização de Dados do ETL (Salvador)

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Ano de referência das Obras Públicas (ex: 2025)"
        required: false
        default: "2025"
        type: string
      full_refresh:
        description: "Forçar reexecução completa (--full-refresh) de todos os mandatos e contratos"
        required: false
        default: false
        type: boolean
  schedule:
    # Execução semanal toda segunda-feira às 06:00 UTC (03:00 BRT)
    - cron: "0 6 * * 1"

permissions:
  contents: write

concurrency:
  group: "etl-update"
  cancel-in-progress: false

jobs:
  update-data:
    name: Executar Pipeline ETL Incremental
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório (com Cache Incremental)
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências do ETL
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar ETL reutilizando e atualizando o Cache Incremental
        env:
          ENABLE_NOMINATIM: "1"
        run: |
          YEAR="${{ inputs.year || '2025' }}"
          EXTRA_ARGS=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then
            EXTRA_ARGS="--full-refresh"
          fi
          python -m etl.main \
            --output-dir public/data \
            --year "${YEAR}" \
            --cache-file public/data/geocoding_cache.json \
            $EXTRA_ARGS

      - name: Validar integridade com suíte de testes (pytest)
        run: python -m pytest

      - name: Versionar artefatos estáticos e Cache Incremental atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/geocoding_cache.json public/data/geo/ public/data/obras/ public/data/index_*.json public/data/index.json
          if git diff --staged --quiet; then
            echo "Nenhuma alteração detectada nos artefatos estáticos ou no cache incremental."
          else
            git commit -m "chore(etl): atualizar artefatos estáticos e cache incremental de obras"
            git push
          fi
